<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harpa Cristã — Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

  <style>
    :root {
      --gold:       #c9a84c;
      --gold-dark:  #8a6820;
      --ink:        #1a1209;
      --parchment:  #faf6ef;
      --parch-dark: #f0e9d8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--ink); font-family: 'Lato', sans-serif; overflow: hidden; }

    /* ── Buscador ── */
    #buscador-tela {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 16px;
    }

    .card {
      background: radial-gradient(circle at top left, var(--parchment) 0%, var(--parch-dark) 100%);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(138,104,32,0.2);
    }

    h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--ink); margin-bottom: 4px; }
    .subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--gold-dark); margin-bottom: 24px; }

    input[type="number"] {
      width: 100%;
      padding: 16px;
      font-size: 24px;
      font-weight: 700;
      border: 2px solid var(--parch-dark);
      border-radius: 12px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      background: white;
      color: var(--ink);
    }
    input[type="number"]:focus { border-color: var(--gold); }

    .btn-search {
      width: 100%;
      background: linear-gradient(135deg, var(--ink) 0%, #2b2015 100%);
      color: var(--parchment);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity .2s;
    }
    .btn-search:active { opacity: .8; }

    /* ── Leitor ── */
    #leitor-tela {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #2a2a2a;
    }

    .toolbar {
      background: var(--ink);
      color: white;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      flex-shrink: 0;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    #titulo-leitor {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--gold);
    }

    #pdf-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      gap: 10px;
    }

    canvas {
      max-width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      background: white;
      border-radius: 2px;
    }

    /* ── Overlay de carregamento ── */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity .4s;
    }
    #loading-overlay.oculto { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(201,168,76,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      text-align: center;
      padding: 0 24px;
    }

    /* ── Erro ── */
    #erro-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ccc;
      text-align: center;
      padding: 32px;
      gap: 12px;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Wrapper relativo para o overlay ── */
    #leitor-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <!-- TELA 1: BUSCADOR -->
  <div id="buscador-tela">
    <div class="card">
      <h1>Harpa Cristã</h1>
      <div class="subtitle">Buscador de Partituras</div>
      <input type="number" id="hinoInput" placeholder="Nº do Hino" inputmode="numeric" min="1" max="640">
      <button class="btn-search" onclick="abrirHino()">VER PARTITURA</button>
    </div>
  </div>

  <!-- TELA 2: LEITOR -->
  <div id="leitor-tela">
    <div class="toolbar">
      <button class="btn-back" onclick="voltarParaBusca()">← Voltar</button>
      <span id="titulo-leitor">Hino</span>
      <div style="width:70px"></div>
    </div>

    <div id="leitor-body">
      <!-- Overlay de loading -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-txt">A carregar partitura…</p>
      </div>

      <!-- Canvas onde o PDF.js renderiza -->
      <div id="pdf-container"></div>

      <!-- Mensagem de erro -->
      <div id="erro-msg">
        <p>⚠️ Não foi possível carregar o PDF.<br>Verifique se o arquivo <strong>harpa.pdf</strong> está na mesma pasta que o <strong>index.html</strong> no GitHub.</p>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    // ── PDF local (mesmo domínio = sem CORS) ─────────────────────
    // Renomeie seu PDF para "harpa.pdf" e coloque na raiz do repositório
    const PDF_URL = 'harpa.pdf';

    let pdfDoc = null;
    let carregando = false;

    // ── Tabela de páginas ─────────────────────────────────────────
    function paginaDo(n) {
      if (n === 1 || n === 2) return 2;
      if (n >= 3  && n <= 5)  return 3;
      if (n >= 6  && n <= 8)  return 4;
      if (n >= 9  && n <= 11) return 5;
      if (n >= 12 && n <= 14) return 6;
      if (n >= 15 && n <= 17) return 7;
      if (n >= 18 && n <= 20) return 8;
      if (n >= 21 && n <= 23) return 9;
      if (n >= 24 && n <= 26) return 10;
      return Math.floor((n - 27) / 3) + 11;
    }

    // ── Abre o hino ───────────────────────────────────────────────
    function abrirHino() {
      const input = document.getElementById('hinoInput');
      const n = parseInt(input.value);

      if (isNaN(n) || n < 1) {
        alert('Por favor, insira um número de hino válido.');
        return;
      }

      const pagina = paginaDo(n);

      // Alterna telas
      document.getElementById('buscador-tela').style.display = 'none';
      document.getElementById('leitor-tela').style.display   = 'flex';
      document.getElementById('titulo-leitor').textContent   = `Hino ${n}`;
      document.getElementById('loading-overlay').classList.remove('oculto');
      document.getElementById('loading-txt').textContent     = 'A carregar partitura…';
      document.getElementById('erro-msg').style.display      = 'none';
      document.getElementById('pdf-container').innerHTML     = '';

      if (pdfDoc) {
        // PDF já em memória — renderiza direto
        renderizarPagina(pagina);
      } else if (!carregando) {
        // Primeira vez — carrega o PDF
        carregando = true;
        pdfjsLib.getDocument(PDF_URL).promise
          .then(pdf => {
            pdfDoc = pdf;
            carregando = false;
            renderizarPagina(pagina);
          })
          .catch(() => {
            carregando = false;
            document.getElementById('loading-overlay').classList.add('oculto');
            document.getElementById('erro-msg').style.display = 'flex';
          });
      }
    }

    // ── Renderiza a página alvo (e as duas seguintes se existirem) ─
    async function renderizarPagina(numPagina) {
      const container = document.getElementById('pdf-container');
      container.innerHTML = '';

      const totalPaginas = pdfDoc.numPages;
      // Renderiza até 3 páginas (uma partitura pode ocupar 1–2 páginas)
      const paginas = [numPagina, numPagina + 1].filter(p => p <= totalPaginas);

      for (const num of paginas) {
        const page = await pdfDoc.getPage(num);
        const largura = container.clientWidth - 16;
        const vpBase  = page.getViewport({ scale: 1 });
        const escala  = largura / vpBase.width;
        const vp      = page.getViewport({ scale: escala });

        const canvas  = document.createElement('canvas');
        canvas.width  = vp.width;
        canvas.height = vp.height;
        container.appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }

      document.getElementById('loading-overlay').classList.add('oculto');
      // Scrolla para o topo
      container.scrollTop = 0;
    }

    function voltarParaBusca() {
      document.getElementById('leitor-tela').style.display  = 'none';
      document.getElementById('buscador-tela').style.display = 'flex';
    }

    document.getElementById('hinoInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') abrirHino();
    });
  </script>
</body>
</html>
