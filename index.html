<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harpa Cristã — Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold:       #c9a84c;
      --gold-dark:  #8a6820;
      --ink:        #1a1209;
      --parchment:  #faf6ef;
      --parch-dark: #f0e9d8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--ink); font-family: 'Lato', sans-serif; overflow: hidden; }

    /* ── Tela do Buscador ── */
    #buscador-tela {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 16px;
    }

    .card {
      background: radial-gradient(circle at top left, var(--parchment) 0%, var(--parch-dark) 100%);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(138,104,32,0.2);
    }

    h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--ink); margin-bottom: 4px; }
    .subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--gold-dark); margin-bottom: 24px; }

    input[type="number"] {
      width: 100%;
      padding: 16px;
      font-size: 24px;
      font-weight: 700;
      border: 2px solid var(--parch-dark);
      border-radius: 12px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      background: white;
      color: var(--ink);
    }
    input[type="number"]:focus {
      border-color: var(--gold);
    }

    .btn-search {
      width: 100%;
      background: linear-gradient(135deg, var(--ink) 0%, #2b2015 100%);
      color: var(--parchment);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity .2s;
    }
    .btn-search:active { opacity: .8; }

    /* ── Tela do Leitor ── */
    #leitor-tela {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #2a2a2a;
    }

    .toolbar {
      background: var(--ink);
      color: white;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      flex-shrink: 0;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    #titulo-leitor {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--gold);
    }

    #pdf-frame-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Overlay de carregamento */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity .4s;
    }
    #loading-overlay.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(201,168,76,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
    }

    /* Botão de fallback (aparece se demorar muito) */
    #btn-fallback {
      display: none;
      margin-top: 8px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* iframe do Google Docs Viewer */
    #pdf-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mensagem de erro */
    #erro-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ccc;
      text-align: center;
      padding: 24px;
      gap: 16px;
    }
    #erro-msg p { font-size: 16px; line-height: 1.6; }
    #btn-abrir-drive {
      background: var(--gold);
      color: var(--ink);
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- ══ TELA 1: BUSCADOR ══ -->
  <div id="buscador-tela">
    <div class="card">
      <h1>Harpa Cristã</h1>
      <div class="subtitle">Buscador de Partituras</div>
      <input type="number" id="hinoInput" placeholder="Nº do Hino" inputmode="numeric" min="1" max="640">
      <button class="btn-search" onclick="abrirHino()">VER PARTITURA</button>
    </div>
  </div>

  <!-- ══ TELA 2: LEITOR ══ -->
  <div id="leitor-tela">
    <div class="toolbar">
      <button class="btn-back" onclick="voltarParaBusca()">← Voltar</button>
      <span id="titulo-leitor">Hino</span>
      <div style="width:70px"></div>
    </div>

    <div id="pdf-frame-wrap">

      <!-- Overlay de carregamento -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-txt">A carregar partitura…</p>
        <button id="btn-fallback" onclick="abrirNoDrive()">
          Abrir no Google Drive ↗
        </button>
      </div>

      <!-- iframe — Google Docs Viewer não tem bloqueio CORS -->
      <iframe id="pdf-iframe" title="Partitura"></iframe>

      <!-- Fallback de erro -->
      <div id="erro-msg">
        <p>Não foi possível exibir o PDF aqui.<br>Abra diretamente no Google Drive para ver a partitura.</p>
        <button id="btn-abrir-drive" onclick="abrirNoDrive()">Abrir no Google Drive ↗</button>
      </div>

    </div>
  </div>

  <script>
    // ── Configuração ──────────────────────────────────────────────
    const ID_DRIVE = "1P8nX0di3BEfca1JN4JIWVpquOZQdr_Ae";

    // URL para o Google Docs Viewer (sem bloqueio CORS no navegador)
    // O "#page=N" funciona no viewer do Google
    function urlViewer(pagina) {
      const pdfUrl = `https://drive.google.com/file/d/${ID_DRIVE}/preview`;
      // O viewer do Google aceita ?page=N para ir direto à página
      return `https://drive.google.com/file/d/${ID_DRIVE}/preview#page=${pagina}`;
    }

    // URL de download direto (para abrir numa nova aba como fallback)
    function urlDireto() {
      return `https://drive.google.com/file/d/${ID_DRIVE}/view`;
    }

    // ── Tabela de páginas ─────────────────────────────────────────
    function paginaDo(n) {
      if (n === 1 || n === 2) return 2;
      if (n >= 3  && n <= 5)  return 3;
      if (n >= 6  && n <= 8)  return 4;
      if (n >= 9  && n <= 11) return 5;
      if (n >= 12 && n <= 14) return 6;
      if (n >= 15 && n <= 17) return 7;
      if (n >= 18 && n <= 20) return 8;
      if (n >= 21 && n <= 23) return 9;
      if (n >= 24 && n <= 26) return 10;
      return Math.floor((n - 27) / 3) + 11;
    }

    // ── Estado ────────────────────────────────────────────────────
    let hinoAtual = null;
    let fallbackTimer = null;

    // ── Funções principais ────────────────────────────────────────
    function abrirHino() {
      const input = document.getElementById('hinoInput');
      const n = parseInt(input.value);

      if (isNaN(n) || n < 1) {
        alert('Por favor, insira um número de hino válido.');
        return;
      }

      hinoAtual = n;
      const pagina = paginaDo(n);

      // Alterna telas
      document.getElementById('buscador-tela').style.display = 'none';
      document.getElementById('leitor-tela').style.display   = 'flex';

      // Reset estado
      document.getElementById('titulo-leitor').textContent = `Hino ${n}`;
      document.getElementById('loading-overlay').classList.remove('oculto');
      document.getElementById('loading-txt').textContent = 'A carregar partitura…';
      document.getElementById('btn-fallback').style.display = 'none';
      document.getElementById('erro-msg').style.display = 'none';
      document.getElementById('pdf-iframe').src = '';

      // Carrega o iframe
      const iframe = document.getElementById('pdf-iframe');
      iframe.src = urlViewer(pagina);

      // Quando o iframe terminar de carregar, esconde o overlay
      iframe.onload = () => {
        clearTimeout(fallbackTimer);
        document.getElementById('loading-overlay').classList.add('oculto');
      };

      // Se demorar mais de 8 s, mostra botão de fallback
      fallbackTimer = setTimeout(() => {
        document.getElementById('loading-txt').textContent = 'A demorar mais do que o normal…';
        document.getElementById('btn-fallback').style.display = 'block';
      }, 8000);
    }

    function voltarParaBusca() {
      clearTimeout(fallbackTimer);
      // Para o iframe (evita downloads em background)
      document.getElementById('pdf-iframe').src = '';
      document.getElementById('leitor-tela').style.display  = 'none';
      document.getElementById('buscador-tela').style.display = 'flex';
    }

    function abrirNoDrive() {
      window.open(urlDireto(), '_blank');
    }

    // Atalho: Enter faz a busca
    document.getElementById('hinoInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') abrirHino();
    });
  </script>
</body>
</html>
