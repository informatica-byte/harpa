<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harpa Cristã — Buscador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:       #c9a84c;
      --gold-dark:  #8a6820;
      --ink:        #1a1209;
      --parchment:  #faf6ef;
      --parch-dark: #f0e9d8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--ink); font-family: 'Lato', sans-serif; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: radial-gradient(circle at top left, var(--parchment) 0%, var(--parch-dark) 100%);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(138,104,32,0.2);
    }

    h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--ink); margin-bottom: 4px; }
    .subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--gold-dark); margin-bottom: 24px; }
    
    input[type="number"] {
      width: 100%;
      padding: 16px;
      font-size: 24px;
      font-weight: 700;
      border: 2px solid var(--parch-dark);
      border-radius: 12px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
    }

    .btn-search {
      width: 100%;
      background: linear-gradient(135deg, var(--ink) 0%, #2b2015 100%);
      color: var(--parchment);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Harpa Cristã</h1>
    <div class="subtitle">Direcionador de Partituras</div>
    <input type="number" id="hinoInput" placeholder="Nº do Hino" inputmode="numeric" min="1">
    <button class="btn-search" onclick="direcionarParaPdf()">ABRIR PDF</button>
  </div>

  <script>
    // Link direto do seu arquivo no Google Drive
    const ID_DRIVE = "1P8nX0di3BEfca1JN4JIWVpquOZQdr_Ae";
    const PDF_URL = `https://drive.google.com/file/d/${ID_DRIVE}/view`;

    // Mapeamento de páginas com base no sumário do seu arquivo
    function obterPaginaHino(n) {
      if (n === 1 || n === 2) return 2;
      if (n >= 3 && n <= 5) return 3;
      if (n >= 6 && n <= 8) return 4;
      if (n >= 9 && n <= 11) return 5;
      if (n >= 12 && n <= 14) return 6;
      if (n >= 15 && n <= 17) return 7;
      if (n >= 18 && n <= 20) return 8;
      if (n >= 21 && n <= 23) return 9;
      if (n >= 24 && n <= 26) return 10;
      return Math.floor((n - 27) / 3) + 11;
    }

    function direcionarParaPdf() {
      const input = document.getElementById('hinoInput');
      const numeroHino = parseInt(input.value);

      if (isNaN(numeroHino) || numeroHino <= 0) {
        alert('Por favor, digite um número de hino válido.');
        return;
      }

      const paginaAlvo = obterPaginaHino(numeroHino);

      // Abre o PDF do Google Drive em uma nova aba apontando para a página correta
      window.open(`${PDF_URL}#page=${paginaAlvo}`, '_blank');
    }

    // Atalho para aceitar o botão "Enter" do teclado
    document.getElementById('hinoInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') direcionarParaPdf();
    });
  </script>
</body>
</html>
